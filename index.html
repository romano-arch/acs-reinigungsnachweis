<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#163a7a">
<title>ACS Reinigungsnachweis v5</title>
<style>
:root{--acs:#163a7a;--acs2:#1f4fa3;--bg:#eef2f8;--card:#fff;--ink:#1d2430;--mut:#667085;--line:#dbe1ea;
--fr:#2c64c4;--gr:#f6c945;--grb:#d9a800;--gp:#2e8b57;--red:#c0392b;--warn:#c77700}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,Arial;padding-bottom:76px}
button{font:inherit;cursor:pointer}
header{position:sticky;top:0;z-index:5;background:linear-gradient(135deg,var(--acs),var(--acs2));color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px}
header .lg{background:#fff;border-radius:8px;padding:3px 6px;display:flex}header .lg img{height:28px;display:block}
header .t{flex:1;min-width:0}header b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}header small{opacity:.85;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
header button{background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:8px;padding:6px 9px;font-size:12px}
.demo{background:#fff8e1;color:#7a5600;font-size:12px;padding:5px 14px;border-bottom:1px solid #f0d27a}
main{max-width:720px;margin:0 auto;padding:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
h2{font-size:16px;margin:2px 0 10px}h3{font-size:14px;margin:12px 0 6px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--mut)}.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-2px;border:1px solid var(--line)}
.et{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--line);cursor:pointer}.et:last-child{border:0}
.et .nm{width:52px;font-weight:700}.mini{display:flex;flex-wrap:wrap;gap:3px;flex:1}
.mini i{width:15px;height:15px;border-radius:3px;border:1px solid #c9d0d8;background:#fff}
.mini i.al{width:auto;padding:0 4px;font-size:10px;font-style:normal;line-height:13px;font-weight:700;color:var(--mut)}
.et .cnt{font-size:12px;color:var(--mut);white-space:nowrap}
.fr{background:var(--fr)!important;border-color:var(--fr)!important;color:#fff!important}
.gr{background:var(--gr)!important;border-color:var(--grb)!important;color:#1d2430!important}
.gp{background:var(--gp)!important;border-color:var(--gp)!important;color:#fff!important}
.ue{box-shadow:0 0 0 2px var(--red)}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tile{position:relative;border:1px solid var(--line);border-radius:10px;padding:9px 2px;text-align:center;background:#fff;min-height:58px;user-select:none}
.tile b{display:block;font-size:15px}.tile small{display:block;font-size:11px;opacity:.85;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 3px}
.tile.sel{outline:3px solid #111;outline-offset:2px}
.tile.ue{box-shadow:0 0 0 3px var(--red)}
.n{position:absolute;top:-7px;right:-6px;background:#1d2430;color:#fff;font-size:10px;font-weight:700;border-radius:8px;padding:1px 5px}
.rb{position:absolute;bottom:-7px;left:50%;transform:translateX(-50%);background:#fff;color:var(--gp);border:1px solid var(--gp);font-size:9px;font-weight:700;border-radius:6px;padding:0 4px}
.btn{display:inline-block;padding:11px 14px;border:0;border-radius:10px;background:var(--acs2);color:#fff;font-weight:600}
.btn.full{display:block;width:100%;margin-top:8px}.btn.sec{background:#fff;color:var(--acs2);border:1px solid var(--acs2)}
.btn.ok{background:var(--gp)}.btn.y{background:var(--gr);color:#1d2430}.btn.red{background:#fff;color:var(--red);border:1px solid var(--red)}
.btn:disabled{opacity:.45}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.f{margin:10px 0}.f label{display:block;font-size:12px;color:var(--mut);margin-bottom:4px}
input,select,textarea{width:100%;font:inherit;padding:10px;border:1px solid var(--line);border-radius:9px;background:#fff}
.task{border:1px solid var(--line);border-left:5px solid var(--fr);border-radius:10px;padding:10px;margin-bottom:8px;background:#fff}
.task.gr{border-left-color:var(--grb)!important;background:#fffdf3!important;color:var(--ink)!important;border-color:var(--line)!important}
.task .h{display:flex;justify-content:space-between;gap:8px;font-weight:700}
.meta{color:var(--mut);font-size:12.5px;margin-top:3px}
.pill{font-size:11px;padding:2px 8px;border-radius:10px;font-weight:700;white-space:nowrap}
.p-red{background:#fdecea;color:var(--red)}.p-warn{background:#fff3e0;color:var(--warn)}.p-ok{background:#e7f5ee;color:var(--gp)}.p-blue{background:#eaf1fd;color:var(--fr)}.p-gr{background:#f2f4f7;color:var(--mut)}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;z-index:6;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:9px 0 10px;font-size:12px;color:var(--mut)}nav button span{display:block;font-size:19px}
nav button.on{color:var(--acs2);font-weight:700}
.bar{position:fixed;left:0;right:0;bottom:62px;z-index:7;background:#1d2430;color:#fff;padding:10px 12px;display:none;gap:8px;align-items:center;flex-wrap:wrap}
.bar.on{display:flex}.bar .c{flex:1;font-size:13px;min-width:120px}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:none;align-items:flex-end;justify-content:center}
.sheet.on{display:flex}.sheet .in{background:#fff;width:100%;max-width:720px;max-height:90vh;overflow:auto;border-radius:16px 16px 0 0;padding:14px 14px calc(40px + env(safe-area-inset-bottom))}
.sheet .x{float:right;border:0;background:#f2f4f7;border-radius:8px;padding:5px 10px}
.vl{border-left:3px solid var(--line);margin:8px 0 14px 6px;padding-left:10px}.vl .ev{font-size:13px;margin:5px 0}.vl .ev b{font-weight:600}
.dgh{display:flex;justify-content:space-between;align-items:center;font-weight:700;margin-top:10px}
table{border-collapse:collapse;width:100%;font-size:12px}th,td{border-bottom:1px solid var(--line);padding:5px 4px;text-align:left;vertical-align:top}th{background:#f4f6f8}
.scroll{overflow-x:auto}
.empty{color:var(--mut);text-align:center;padding:18px 6px}
.toast{position:fixed;left:50%;bottom:140px;transform:translateX(-50%);background:#1d2430;color:#fff;padding:10px 16px;border-radius:10px;z-index:30;display:none;max-width:90%}
.login{max-width:380px;margin:40px auto;text-align:center}.login img{max-width:240px;width:80%}
.seg{display:flex;gap:6px}.seg button{flex:1;border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 0}.seg button.on{background:var(--acs2);color:#fff;border-color:var(--acs2)}
#druck{display:none}
@media print{body{background:#fff;padding:0}header,nav,.bar,.demo,main,.sheet,.toast{display:none!important}#druck{display:block;font-size:10.5px}
#druck h1{font-size:15px;margin:0 0 4px}#druck table{font-size:9.5px}#druck th,#druck td{padding:3px}}
</style></head><body>
<div id="app"></div>
<div class="bar" id="bar"></div>
<div class="sheet" id="sheet"><div class="in" id="sheetin"></div></div>
<div class="toast" id="toast"></div>
<div id="druck"></div>

function csv(){const {dg,st}=nachweisDaten();const z=[["OZ","Flaeche","Art","angefordert_am","angefordert_von","bis","gereinigt_am","gereinigt_von","geprueft_am","geprueft_von","Rechnung"]];

["anfordern","gereinigt","pruefen","nichtOk","zuruecknehmen","abrechnen","stdAnordnen","stdErfassen","stdAendern","stdZurueckziehen","stdZurueckAnACS","stdBestaetigen","stdUnterschriftAufheben","rechnungAendern","gereinigtZurueck","bisAendern","nachtragen","renderLogin","rolle","abmelden","nwUnterschreiben","laden"].forEach(n=>L[n]=window[n]);

async function alle(tab,sel){let out=[],von=0;for(;;){const {data,error}=await SB.from(tab).select(sel||"*").eq("projekt_id",PID).range(von,von+999);if(error)throw error;out=out.concat(data);if(data.length<1000)return out;von+=1000}}
async function neuLaden(){if(PROBE||!PID||LADEN)return;LADEN=true;try{
  const [fl,dg,st,ev,sg]=await Promise.all([alle("flaechen"),alle("durchgaenge"),alle("stunden"),alle("ereignisse"),alle("nachweis_unterschriften")]);
  const evDg={},evSt={};ev.sort((a,b)=>a.zeit.localeCompare(b.zeit)).forEach(e=>{const x={dg:e.durchgang_id,typ:e.typ,zeit:e.zeit,von:e.user_name,text:e.text||""};if(e.durchgang_id)(evDg[e.durchgang_id]=evDg[e.durchgang_id]||[]).push(x);else(evSt[e.stunden_id]=evSt[e.stunden_id]||[]).push(x)});
  D.fl=fl.filter(f=>f.aktiv).sort((a,b)=>a.sortierung-b.sortierung).map(f=>({id:f.id,typ:f.typ,etage:f.etage,nummer:f.nummer,name:f.name,zi:f.zimmer,qm:f.qm!=null?+f.qm:null,zusatz:f.zusatz,ozF:f.oz_fein,ozN:f.oz_nach}));
  D.dg=dg.map(d=>({id:d.id,fid:d.flaeche_id,nr:d.nr,oz:d.oz,status:d.status,bis:d.bis,bem:d.bemerkung||"",an_am:d.an_am,an_von:d.an_von_name,ge_am:d.ge_am,ge_von:d.ge_von_name,gp_am:d.gp_am,gp_von:d.gp_von_name,
    nach:d.nachgetragen?1:0,nach_von:d.nach_von_name,nach_am:d.nach_am,rechnung:d.rechnung||undefined,re_am:d.re_am,re_von:d.re_von_name}));
  D.ev=Object.values(evDg).flat();
  D.std=st.map(s=>({id:s.id,datum:s.datum,etage:s.etage,was:s.was,status:s.status,muendlich:s.muendlich,an_am:s.an_am,an_von:s.an_von_name,pers:s.pers,std:s.std!=null?+s.std:null,notiz:s.notiz||"",
    ei_am:s.ei_am,ei_von:s.ei_von_name,be_am:s.be_am,be_von:s.be_von_name,sig:s.unterschrift,zg_grund:s.zg_grund,rechnung:s.rechnung||undefined,re_am:s.re_am,ev:evSt[s.id]||[]}));
  D.sig={};sg.forEach(x=>D.sig[x.schluessel]={name:x.name,zeit:x.zeit,img:x.bild});
  if(!$("#sheet").classList.contains("on")&&!(document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)))render();
 }catch(e){toast("Daten konnten nicht geladen werden: "+(e.message||e))}finally{LADEN=false}}

  if(einladung())SB.rpc("fn_einladung_einloesen",{p_code:einladung(),p_name:p.name}).then(()=>{try{localStorage.removeItem(EINL_KEY)}catch(e){}})}
